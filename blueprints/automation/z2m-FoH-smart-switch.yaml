# ══════════════════════════════════════════════════════════════════════════════
#  Home Assistant Automation Blueprint
#  EnOcean PTM215Z (Friends of Hue) – Zigbee2MQTT
#  Gerätesteuerung: Kurzdruck (Toggle/Szene) · Halten (Dim/Tilt) · Wiederholt (Szenen)
# ══════════════════════════════════════════════════════════════════════════════
#
#  INSTALLATION
#  ────────────
#  1. Diese Datei nach config/blueprints/automation/ kopieren.
#  2. In Z2M → Einstellungen → Erweitert: "elapsed" aktivieren  ← PFLICHT
#  3. In HA: Einstellungen → Automationen → Automation erstellen →
#     "Blueprint" auswählen → dieses Blueprint wählen.
#  4. Mindestversion: Home Assistant 2024.6.0 (wegen Sektionen)
#
#  FUNKTIONSWEISE
#  ──────────────
#  ┌────────────────────────────────────────────────────────────────────────┐
#  │  Aktion                  │  Verhalten                                  │
#  ├──────────────────────────┼─────────────────────────────────────────────┤
#  │  Kurzdruck               │  elapsed ≥ repeat_threshold:                │
#  │  (erste Betätigung)      │  → Toggle oder konfigurierte Szene          │
#  │                          │  (separat für oben/unten konfigurierbar)    │
#  ├──────────────────────────┼─────────────────────────────────────────────┤
#  │  Wiederholter Druck      │  elapsed < repeat_threshold:                │
#  │  (erneut innerhalb ~4s)  │  → Nächste LRU-Szene aktivieren            │
#  ├──────────────────────────┼─────────────────────────────────────────────┤
#  │  Halten oben             │  Helligkeit erhöhen                         │
#  │                          │  MQTT-Lampe: brightness_move (einmalig)     │
#  │                          │  Andere: brightness_step_pct (Loop)         │
#  │  Halten unten            │  Helligkeit reduzieren (analog)             │
#  │  Halten (Cover)          │  open/close → stop bei Release              │
#  └──────────────────────────┴─────────────────────────────────────────────┘
#
#  BRIGHTNESS_MOVE (automatisch)
#  ─────────────────────────────
#  Ist die Lampe über Z2M/MQTT eingebunden, sendet der Blueprint beim Halten
#  einen einzigen brightness_move-Befehl statt eines Step-Loops.
#  → Flüssigeres Dimmen, weniger Bus-Last.
#  → Automatische Erkennung via integration_entities('mqtt').
#  → Z2M-Gerätename wird aus dem HA-Gerätenamen abgeleitet (überschreibbar).
#  → Fallback auf Step-Loop per Haken "Immer Step-Loop" oder wenn Gerät
#    kein brightness_move unterstützt.
#
#  SZENEN-LOGIK (Wiederholter Druck)
#  ───────────────────────────────────
#  Kein externer Helper nötig.
#  HA speichert Zeitstempel der letzten Aktivierung als state jeder Szene.
#  Immer die am längsten nicht aktive Szene wird gewählt (LRU).
#
# ══════════════════════════════════════════════════════════════════════════════

blueprint:
  name: "Z2M – Friends of Hue: Wippen-Gerätesteuerung (Licht/Rollladen)"
  description: >
    Gerätesteuerung mit dem EnOcean PTM215Z (Friends of Hue) über Zigbee2MQTT.
    Kurzdruck: Toggle oder Szene (oben/unten separat konfigurierbar).
    Wiederholter Druck: LRU-Szene. Halten: Dimmen/Fahren.
    Automatisches brightness_move für Z2M-Lampen.
    Mindestversion: Home Assistant 2024.6.0.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:

    # ── Pflichtfeld: immer sichtbar ───────────────────────────────────────────
    controller:
      name: Z2M Gerätename des Schalters
      description: >
        Name des Schalters exakt wie in Zigbee2MQTT konfiguriert.
        Beispiel: "LS Arbeitszimmer"
      selector:
        text:

    # ════════════════════════════════════════════════════════════════════════
    # SEKTION: ERWEITERTE EINSTELLUNGEN
    # ════════════════════════════════════════════════════════════════════════
    section_advanced:
      name: "🔧 Erweiterte Einstellungen"
      icon: mdi:wrench
      collapsed: true
      input:

        base_topic:
          name: Zigbee2MQTT Base-Topic
          description: Das in Z2M konfigurierte Basis-Topic (ohne abschließenden Schrägstrich).
          default: zigbee2mqtt
          selector:
            text:

        hold_threshold:
          name: Halte-Schwelle (ms)
          description: >
            Zeit in ms ohne Release, nach der Halten erkannt wird.
          default: 500
          selector:
            number:
              min: 100
              max: 2000
              unit_of_measurement: ms
              step: 50
              mode: slider

        repeat_threshold:
          name: Wiederholungs-Schwelle (ms)
          description: >
            Liegt elapsed darunter, gilt der Druck als "wiederholter Druck"
            → LRU-Szene. Liegt er darüber → Toggle/Szene (Kurzdruck).
          default: 1500
          selector:
            number:
              min: 500
              max: 10000
              unit_of_measurement: ms
              step: 500
              mode: slider

        hold_step:
          name: Dimm-Schrittweite (%)
          description: >
            Step-Loop Modus: Um wie viel % Helligkeit pro Schritt gedimmt wird.
            Nicht relevant wenn brightness_move verwendet wird.
          default: 5
          selector:
            number:
              min: 1
              max: 20
              unit_of_measurement: "%"
              step: 1
              mode: slider

        dim_interval:
          name: Dimm-Intervall (ms)
          description: >
            Step-Loop Modus: Pause zwischen zwei Dimm-Schritten.
            Höhere Werte = weniger Bus-Last, langsameres Dimmen.
            Nicht relevant wenn brightness_move verwendet wird.
          default: 150
          selector:
            number:
              min: 50
              max: 1000
              unit_of_measurement: ms
              step: 25
              mode: slider

        brightness_move_speed:
          name: brightness_move Geschwindigkeit (units/s)
          description: >
            Geschwindigkeit beim Dimmen via brightness_move (nur für Z2M MQTT-Lampen).
            Einheit: Zigbee-Helligkeitseinheiten/Sekunde (Bereich 0–254).
            Beispiel: 100 = ca. 2,5 Sekunden von 0 auf 100%.
          default: 100
          selector:
            number:
              min: 10
              max: 254
              unit_of_measurement: units/s
              step: 5
              mode: slider

        force_step_loop:
          name: Immer Step-Loop verwenden
          description: >
            Wenn aktiviert, wird auch bei MQTT-Lampen der Step-Loop
            (brightness_step_pct) verwendet statt brightness_move.
            Nützlich wenn brightness_move vom Gerät nicht unterstützt wird.
          default: false
          selector:
            boolean:

    # ════════════════════════════════════════════════════════════════════════
    # SEKTION: WIPPE LINKS – Tasten 1 (oben) & 2 (unten)
    # ════════════════════════════════════════════════════════════════════════
    section_wippe_1:
      name: "◀ Wippe Links"
      icon: mdi:gesture-tap-button
      collapsed: false
      input:

        wippe_1_device:
          name: Gerät
          description: >
            Lampe oder Rollladen für die linke Wippe.
            Optional – leer lassen um deaktivieren.
          default: {}
          selector:
            entity:
              domain: [light, cover]
              multiple: false

        wippe_1_z2m_name:
          name: Z2M-Gerätename (optional)
          description: >
            Z2M-Name der Lampe, falls abweichend vom HA-Gerätenamen.
            Leer lassen → wird automatisch aus dem HA-Gerätenamen abgeleitet.
            Nur relevant für brightness_move (MQTT-Modus).
            Beispiel: "Wohnzimmer Deckenlampe"
          default: ""
          selector:
            text:

        wippe_1_press_up_action:
          name: "Oben: Kurzdruck-Aktion"
          description: Aktion beim ersten (nicht wiederholten) Kurzdruck auf die obere Taste.
          default: toggle
          selector:
            select:
              options:
                - label: "Toggle (an/aus)"
                  value: toggle
                - label: "Szene aktivieren"
                  value: scene

        wippe_1_press_up_scene:
          name: "Oben: Szene für Kurzdruck"
          description: >
            Szene die beim Kurzdruck oben aktiviert wird.
            Nur aktiv wenn Kurzdruck-Aktion = "Szene aktivieren".
          default: {}
          selector:
            entity:
              domain: scene
              multiple: false

        wippe_1_press_down_action:
          name: "Unten: Kurzdruck-Aktion"
          description: Aktion beim ersten (nicht wiederholten) Kurzdruck auf die untere Taste.
          default: toggle
          selector:
            select:
              options:
                - label: "Toggle (an/aus)"
                  value: toggle
                - label: "Szene aktivieren"
                  value: scene

        wippe_1_press_down_scene:
          name: "Unten: Szene für Kurzdruck"
          description: >
            Szene die beim Kurzdruck unten aktiviert wird.
            Nur aktiv wenn Kurzdruck-Aktion = "Szene aktivieren".
          default: {}
          selector:
            entity:
              domain: scene
              multiple: false

        wippe_1_scenes:
          name: Szenen (wiederholter Druck)
          description: >
            Szenen die beim wiederholten Druck (LRU-Logik) aktiviert werden.
            Optional – leer lassen wenn nicht gewünscht.
          default: []
          selector:
            entity:
              domain: scene
              multiple: true

    # ════════════════════════════════════════════════════════════════════════
    # SEKTION: WIPPE RECHTS – Tasten 3 (oben) & 4 (unten)
    # ════════════════════════════════════════════════════════════════════════
    section_wippe_2:
      name: "▶ Wippe Rechts"
      icon: mdi:gesture-tap-button
      collapsed: false
      input:

        wippe_2_device:
          name: Gerät
          description: >
            Lampe oder Rollladen für die rechte Wippe.
            Optional – leer lassen um deaktivieren.
          default: {}
          selector:
            entity:
              domain: [light, cover]
              multiple: false

        wippe_2_z2m_name:
          name: Z2M-Gerätename (optional)
          description: >
            Z2M-Name der Lampe, falls abweichend vom HA-Gerätenamen.
            Leer lassen → wird automatisch aus dem HA-Gerätenamen abgeleitet.
          default: ""
          selector:
            text:

        wippe_2_press_up_action:
          name: "Oben: Kurzdruck-Aktion"
          default: toggle
          selector:
            select:
              options:
                - label: "Toggle (an/aus)"
                  value: toggle
                - label: "Szene aktivieren"
                  value: scene

        wippe_2_press_up_scene:
          name: "Oben: Szene für Kurzdruck"
          default: {}
          selector:
            entity:
              domain: scene
              multiple: false

        wippe_2_press_down_action:
          name: "Unten: Kurzdruck-Aktion"
          default: toggle
          selector:
            select:
              options:
                - label: "Toggle (an/aus)"
                  value: toggle
                - label: "Szene aktivieren"
                  value: scene

        wippe_2_press_down_scene:
          name: "Unten: Szene für Kurzdruck"
          default: {}
          selector:
            entity:
              domain: scene
              multiple: false

        wippe_2_scenes:
          name: Szenen (wiederholter Druck)
          default: []
          selector:
            entity:
              domain: scene
              multiple: true

    # ════════════════════════════════════════════════════════════════════════
    # SEKTION: WIPPE LINKS+RECHTS – Tasten 1+3 (oben) & 2+4 (unten)
    # ════════════════════════════════════════════════════════════════════════
    section_wippe_both:
      name: "◀▶ Wippe Links+Rechts"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:

        wippe_both_device:
          name: Gerät
          description: >
            Lampe oder Rollladen bei gemeinsamer Betätigung beider Wippen.
            Optional – leer lassen um deaktivieren.
          default: {}
          selector:
            entity:
              domain: [light, cover]
              multiple: false

        wippe_both_z2m_name:
          name: Z2M-Gerätename (optional)
          description: >
            Z2M-Name der Lampe, falls abweichend vom HA-Gerätenamen.
            Leer lassen → wird automatisch aus dem HA-Gerätenamen abgeleitet.
          default: ""
          selector:
            text:

        wippe_both_press_up_action:
          name: "Oben: Kurzdruck-Aktion"
          default: toggle
          selector:
            select:
              options:
                - label: "Toggle (an/aus)"
                  value: toggle
                - label: "Szene aktivieren"
                  value: scene

        wippe_both_press_up_scene:
          name: "Oben: Szene für Kurzdruck"
          default: {}
          selector:
            entity:
              domain: scene
              multiple: false

        wippe_both_press_down_action:
          name: "Unten: Kurzdruck-Aktion"
          default: toggle
          selector:
            select:
              options:
                - label: "Toggle (an/aus)"
                  value: toggle
                - label: "Szene aktivieren"
                  value: scene

        wippe_both_press_down_scene:
          name: "Unten: Szene für Kurzdruck"
          default: {}
          selector:
            entity:
              domain: scene
              multiple: false

        wippe_both_scenes:
          name: Szenen (wiederholter Druck)
          default: []
          selector:
            entity:
              domain: scene
              multiple: true

# ── Automation-Konfiguration ──────────────────────────────────────────────────

mode: single
max_exceeded: silent

variables:
  # Einstellungen
  hold_threshold: !input hold_threshold
  repeat_threshold: !input repeat_threshold
  hold_step: !input hold_step
  dim_interval: !input dim_interval
  brightness_move_speed: !input brightness_move_speed
  force_step_loop: !input force_step_loop
  # Wippe Links
  wippe_1_device: !input wippe_1_device
  wippe_1_z2m_name: !input wippe_1_z2m_name
  wippe_1_press_up_action: !input wippe_1_press_up_action
  wippe_1_press_up_scene: !input wippe_1_press_up_scene
  wippe_1_press_down_action: !input wippe_1_press_down_action
  wippe_1_press_down_scene: !input wippe_1_press_down_scene
  wippe_1_scenes: !input wippe_1_scenes
  # Wippe Rechts
  wippe_2_device: !input wippe_2_device
  wippe_2_z2m_name: !input wippe_2_z2m_name
  wippe_2_press_up_action: !input wippe_2_press_up_action
  wippe_2_press_up_scene: !input wippe_2_press_up_scene
  wippe_2_press_down_action: !input wippe_2_press_down_action
  wippe_2_press_down_scene: !input wippe_2_press_down_scene
  wippe_2_scenes: !input wippe_2_scenes
  # Wippe Links+Rechts
  wippe_both_device: !input wippe_both_device
  wippe_both_z2m_name: !input wippe_both_z2m_name
  wippe_both_press_up_action: !input wippe_both_press_up_action
  wippe_both_press_up_scene: !input wippe_both_press_up_scene
  wippe_both_press_down_action: !input wippe_both_press_down_action
  wippe_both_press_down_scene: !input wippe_both_press_down_scene
  wippe_both_scenes: !input wippe_both_scenes

trigger_variables:
  base_topic: !input base_topic
  controller: !input controller

trigger:
  - platform: mqtt
    topic: "{{ base_topic }}/{{ controller }}"

condition:
  - condition: template
    value_template: >
      {{ trigger.payload_json.action is defined and
         'press_' in trigger.payload_json.action }}

action:
  # ── Schritt 1: Alle relevanten Werte aus Payload und Konfiguration ableiten ──
  - variables:
      wippe: >
        {% if trigger.payload_json.action in ['press_1', 'press_2'] %}wippe_1
        {% elif trigger.payload_json.action in ['press_3', 'press_4'] %}wippe_2
        {% elif trigger.payload_json.action in ['press_1_and_3', 'press_2_and_4'] %}wippe_both
        {% else %}unknown
        {% endif %}
      direction: >
        {% if trigger.payload_json.action in ['press_1', 'press_3', 'press_1_and_3'] %}up
        {% else %}down
        {% endif %}
      # elapsed: ms seit letztem MQTT-Event dieses Geräts.
      # Default 999999 wenn elapsed fehlt (Z2M-Option nicht aktiviert).
      elapsed: >
        {{ trigger.payload_json.elapsed | default(999999) | int }}
      # Gerät für diese Wippe
      target_device: >
        {% if wippe == 'wippe_1' %}{{ wippe_1_device }}
        {% elif wippe == 'wippe_2' %}{{ wippe_2_device }}
        {% else %}{{ wippe_both_device }}
        {% endif %}
      # Szenen (LRU) für diese Wippe
      target_scenes: >
        {% if wippe == 'wippe_1' %}{{ wippe_1_scenes }}
        {% elif wippe == 'wippe_2' %}{{ wippe_2_scenes }}
        {% else %}{{ wippe_both_scenes }}
        {% endif %}
      # Device-Typ
      device_type: >
        {% if target_device is string and target_device.startswith('light.') %}light
        {% elif target_device is string and target_device.startswith('cover.') %}cover
        {% else %}none
        {% endif %}
      # Expected Release (z.B. press_1 → release_1)
      expected_release: "{{ trigger.payload_json.action | replace('press_', 'release_') }}"
      # Wiederholter Druck: elapsed unter Schwelle UND LRU-Szenen vorhanden
      is_repeated_press: >
        {{ elapsed < repeat_threshold and target_scenes | length > 0 }}

      # ── Z2M-Name für brightness_move ──
      # Überschreibung aus Konfiguration oder automatisch aus HA-Gerätename
      z2m_name_override: >
        {% if wippe == 'wippe_1' %}{{ wippe_1_z2m_name }}
        {% elif wippe == 'wippe_2' %}{{ wippe_2_z2m_name }}
        {% else %}{{ wippe_both_z2m_name }}
        {% endif %}
      z2m_name: >
        {% if z2m_name_override is string and z2m_name_override != '' %}
          {{ z2m_name_override }}
        {% elif target_device is string and target_device != '' %}
          {{ device_attr(target_device, 'name') | default('') }}
        {% else %}
          {{ '' }}
        {% endif %}
      # brightness_move verwenden wenn:
      # - Gerät ist Lampe
      # - Gerät ist über MQTT (Z2M) eingebunden
      # - force_step_loop ist nicht aktiv
      # - Z2M-Name konnte ermittelt werden
      use_brightness_move: >
        {{ device_type == 'light'
           and not force_step_loop
           and target_device in integration_entities('mqtt')
           and z2m_name != '' }}

      # ── Kurzdruck-Konfiguration für diese Richtung ──
      press_action: >
        {% if wippe == 'wippe_1' %}
          {% if direction == 'up' %}{{ wippe_1_press_up_action }}
          {% else %}{{ wippe_1_press_down_action }}{% endif %}
        {% elif wippe == 'wippe_2' %}
          {% if direction == 'up' %}{{ wippe_2_press_up_action }}
          {% else %}{{ wippe_2_press_down_action }}{% endif %}
        {% else %}
          {% if direction == 'up' %}{{ wippe_both_press_up_action }}
          {% else %}{{ wippe_both_press_down_action }}{% endif %}
        {% endif %}
      press_scene: >
        {% if wippe == 'wippe_1' %}
          {% if direction == 'up' %}{{ wippe_1_press_up_scene }}
          {% else %}{{ wippe_1_press_down_scene }}{% endif %}
        {% elif wippe == 'wippe_2' %}
          {% if direction == 'up' %}{{ wippe_2_press_up_scene }}
          {% else %}{{ wippe_2_press_down_scene }}{% endif %}
        {% else %}
          {% if direction == 'up' %}{{ wippe_both_press_up_scene }}
          {% else %}{{ wippe_both_press_down_scene }}{% endif %}
        {% endif %}
      # Ist eine gültige Kurzdruck-Szene konfiguriert?
      has_press_scene: >
        {{ press_action == 'scene'
           and press_scene is string
           and press_scene.startswith('scene.') }}

  # ════════════════════════════════════════════════════════════════════════
  # PHASE 1 – Halte-Erkennung
  # Warte auf Release (max. hold_threshold ms)
  # ════════════════════════════════════════════════════════════════════════
  - wait_for_trigger:
      - platform: mqtt
        topic: "{{ base_topic }}/{{ controller }}"
    timeout:
      milliseconds: "{{ hold_threshold }}"
    continue_on_timeout: true

  - choose:

      # ┌──────────────────────────────────────────────────────────────────┐
      # │  HALTEN – Dimmen / Fahren                                        │
      # │  Kein Release innerhalb hold_threshold → Hold erkannt            │
      # └──────────────────────────────────────────────────────────────────┘
      - conditions: >
          {{ not wait.completed and device_type != 'none' }}
        sequence:
          - choose:

              # ── Cover: open/close einmalig → warten bis Release → stop ──
              - conditions: "{{ device_type == 'cover' }}"
                sequence:
                  - choose:
                      - conditions: "{{ direction == 'up' }}"
                        sequence:
                          - service: cover.open_cover
                            target:
                              entity_id: "{{ target_device }}"
                      - conditions: "{{ direction == 'down' }}"
                        sequence:
                          - service: cover.close_cover
                            target:
                              entity_id: "{{ target_device }}"
                  - variables:
                      release_detected: false
                  - repeat:
                      until: "{{ release_detected }}"
                      sequence:
                        - wait_for_trigger:
                            - platform: mqtt
                              topic: "{{ base_topic }}/{{ controller }}"
                          timeout:
                            milliseconds: 100
                          continue_on_timeout: true
                        - variables:
                            release_detected: >
                              {{ wait.trigger is not none and
                                 wait.trigger.payload_json.action is defined and
                                 wait.trigger.payload_json.action == expected_release }}
                  - service: cover.stop_cover
                    target:
                      entity_id: "{{ target_device }}"

              # ── Lampe via brightness_move (Z2M MQTT – einmalig) ──
              - conditions: "{{ device_type == 'light' and use_brightness_move }}"
                sequence:
                  # brightness_move starten (positiv = heller, negativ = dunkler)
                  - service: mqtt.publish
                    data:
                      topic: "{{ base_topic }}/{{ z2m_name }}/set"
                      payload: >
                        {"brightness_move": {{ brightness_move_speed if direction == 'up' else -brightness_move_speed }}}
                  # Warten bis Release kommt
                  - variables:
                      release_received: false
                  - repeat:
                      until: "{{ release_received }}"
                      sequence:
                        - wait_for_trigger:
                            - platform: mqtt
                              topic: "{{ base_topic }}/{{ controller }}"
                          timeout:
                            seconds: 30
                          continue_on_timeout: true
                        - variables:
                            release_received: >
                              {{ wait.trigger is not none and
                                 wait.trigger.payload_json.action is defined and
                                 wait.trigger.payload_json.action == expected_release }}
                  # brightness_move stoppen
                  - service: mqtt.publish
                    data:
                      topic: "{{ base_topic }}/{{ z2m_name }}/set"
                      payload: '{"brightness_move": 0}'

            # ── Lampe via Step-Loop (Fallback / force_step_loop aktiv) ──
            default:
              - variables:
                  release_received: false
              - repeat:
                  until: "{{ release_received or repeat.index > 300 }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: "{{ target_device }}"
                      data:
                        brightness_step_pct: >
                          {{ hold_step if direction == 'up' else -hold_step }}
                    - wait_for_trigger:
                        - platform: mqtt
                          topic: "{{ base_topic }}/{{ controller }}"
                      timeout:
                        milliseconds: "{{ dim_interval }}"
                      continue_on_timeout: true
                    - variables:
                        release_received: >
                          {{ release_received or (
                             wait.trigger is not none and
                             wait.trigger.payload_json.action is defined and
                             wait.trigger.payload_json.action == expected_release) }}

    # ┌──────────────────────────────────────────────────────────────────────┐
    # │  Release kam rechtzeitig → Kurzdruck oder wiederholter Druck?      │
    # │  Entscheidung sofort via elapsed – kein weiterer Timeout.           │
    # └──────────────────────────────────────────────────────────────────────┘
    default:
      - choose:

          # ┌────────────────────────────────────────────────────────────────┐
          # │  WIEDERHOLTER DRUCK – LRU-Szene aktivieren                    │
          # │  elapsed < repeat_threshold UND LRU-Szenen konfiguriert       │
          # └────────────────────────────────────────────────────────────────┘
          - conditions: "{{ is_repeated_press }}"
            sequence:
              - variables:
                  scene_to_activate: >
                    {% set ns = namespace(scene=target_scenes[0], oldest=now()) %}
                    {% for s in target_scenes %}
                      {% set t = states(s) %}
                      {% if t in ['unknown', 'unavailable'] %}
                        {# Noch nie aktiviert → definitiv älteste #}
                        {% set ns.scene = s %}
                        {% set ns.oldest = as_datetime('1970-01-01 00:00:00+00:00') %}
                      {% elif ns.oldest > as_datetime('1970-01-01 00:00:00+00:00') %}
                        {# Nur prüfen wenn noch keine "nie aktivierte" Szene gefunden #}
                        {% set scene_time = t | as_datetime %}
                        {% if scene_time < ns.oldest %}
                          {% set ns.oldest = scene_time %}
                          {% set ns.scene = s %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.scene }}
              - service: scene.turn_on
                target:
                  entity_id: "{{ scene_to_activate }}"

        # ┌──────────────────────────────────────────────────────────────────┐
        # │  KURZDRUCK – Toggle oder konfigurierte Szene                    │
        # │  elapsed ≥ repeat_threshold → erste / neue Betätigung           │
        # └──────────────────────────────────────────────────────────────────┘
        default:
          - choose:

              # Konfigurierte Kurzdruck-Szene (oben oder unten, je nach direction)
              - conditions: "{{ has_press_scene }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: "{{ press_scene }}"

              # Toggle Lampe
              - conditions: "{{ device_type == 'light' }}"
                sequence:
                  - service: light.toggle
                    target:
                      entity_id: "{{ target_device }}"

              # Cover öffnen (oben)
              - conditions: "{{ device_type == 'cover' and direction == 'up' }}"
                sequence:
                  - service: cover.open_cover
                    target:
                      entity_id: "{{ target_device }}"

              # Cover schließen (unten)
              - conditions: "{{ device_type == 'cover' and direction == 'down' }}"
                sequence:
                  - service: cover.close_cover
                    target:
                      entity_id: "{{ target_device }}"

# ══════════════════════════════════════════════════════════════════════════════
#  LOGIK-ÜBERSICHT
# ══════════════════════════════════════════════════════════════════════════════
#
#  PRESS kommt rein
#    ↓
#    Warte max. hold_threshold ms auf Release
#    ├─ KEIN Release (Timeout) → HALTEN
#    │   ├─ Cover     → open/close → warten → stop
#    │   ├─ Licht     → brightness_move (wenn MQTT & !force_step_loop)
#    │   │               → einmalig senden → warten → stop (brightness_move: 0)
#    │   └─ Licht     → Step-Loop (brightness_step_pct alle dim_interval ms)
#    │
#    └─ Release kam → KURZDRUCK oder WIEDERHOLT (sofort via elapsed)
#        ├─ elapsed < repeat_threshold UND LRU-Szenen → WIEDERHOLT → LRU-Szene
#        └─ elapsed ≥ repeat_threshold → KURZDRUCK
#            ├─ Kurzdruck-Aktion = "Szene" + Szene konfiguriert → scene.turn_on
#            ├─ Gerät = Lampe    → light.toggle
#            ├─ Gerät = Cover ↑  → cover.open_cover
#            └─ Gerät = Cover ↓  → cover.close_cover
#
#  BRIGHTNESS_MOVE ERKENNUNG
#  ──────────────────────────
#  use_brightness_move = true wenn ALLE Bedingungen erfüllt:
#    1. device_type == 'light'
#    2. force_step_loop == false
#    3. target_device in integration_entities('mqtt')  ← Z2M-Gerät?
#    4. z2m_name != ''  ← Name ermittelbar?
#
#  Z2M-Name Reihenfolge:
#    1. Manuelle Eingabe (z2m_name_override) wenn nicht leer
#    2. device_attr(target_device, 'name')  ← HA-Gerätename
#
#  ACHTUNG: Wenn der HA-Gerätename nachträglich umbenannt wurde,
#           weicht er vom Z2M-Namen ab → manuelle Überschreibung nötig.
#
#  LRU-SZENEN-LOGIK
#  ────────────────
#  HA speichert Zeitstempel der letzten Aktivierung als state jeder Szene.
#  unknown/unavailable → noch nie aktiviert → höchste Priorität (älteste).
#
#  Beispiel (repeat_threshold: 4000ms, 3 Szenen A/B/C):
#    Szene A: 10:15  │  Szene B: 10:45  │  Szene C: unknown
#    Druck 1 (elapsed 60s)  → Toggle  (neue Betätigung)
#    Druck 2 (elapsed 1,0s) → Szene C (unknown = nie aktiviert)
#    Druck 3 (elapsed 2,0s) → Szene A (10:15 < 10:45)
#    Druck 4 (elapsed 2,0s) → Szene B (älteste verbleibende)
#    Druck 5 (elapsed 60s)  → Toggle  (neue Betätigung)
#
# ══════════════════════════════════════════════════════════════════════════════
#  TROUBLESHOOTING
# ══════════════════════════════════════════════════════════════════════════════
#
#  PROBLEM: brightness_move wird nicht verwendet obwohl Lampe in Z2M ist
#  ─────────────────────────────────────────────────────────────────────
#    → Haken "Immer Step-Loop" aktiv? → Haken entfernen
#    → Z2M-Name korrekt? → Einstellung "Z2M-Gerätename" prüfen/setzen
#    → Lampe in HA als MQTT-Entity? → Entwicklerwerkzeuge → Zustände →
#      Entität suchen → Attribute → platform sollte "mqtt" sein
#    → Alternativ: Automation Traces prüfen → Variable "use_brightness_move"
#
#  PROBLEM: brightness_move startet aber stoppt nicht
#  ──────────────────────────────────────────────────
#    → Z2M-Topic korrekt? → MQTT Explorer prüfen:
#      zigbee2mqtt/[Z2M-Name]/set
#    → Release-Event kommt nicht an → Z2M "elapsed" aktiviert?
#
#  PROBLEM: Szenen werden nie aktiviert (immer Toggle)
#  ────────────────────────────────────────────────────
#    → Z2M "elapsed" aktiviert? (Einstellungen → Erweitert) ← PFLICHT
#    → repeat_threshold erhöhen (Standard: 4000ms)
#    → Test: MQTT Explorer → Payload prüfen ob "elapsed" vorhanden
#
#  PROBLEM: Kurzdruck-Szene wird nicht aktiviert
#  ───────────────────────────────────────────────
#    → Kurzdruck-Aktion = "Szene aktivieren" ausgewählt?
#    → Szene für den jeweiligen Button (oben/unten) konfiguriert?
#    → Szenen-Entity gültig? (scene.xxx)
#
#  PROBLEM: Halten wird nicht erkannt
#  ────────────────────────────────────
#    → Gerät für diese Wippe konfiguriert?
#    → hold_threshold erhöhen?
#    → Traces: Einstellungen → Automationen → Automation → Traces
#
#  PROBLEM: Toggle verzögert
#  ──────────────────────────
#    → Ist normal wenn keine LRU-Szenen konfiguriert sind und elapsed fehlt
#    → Mit elapsed: Toggle reagiert sofort (kein Timeout mehr)
#    → Z2M "elapsed" aktiviert? ← PFLICHT
#
# ══════════════════════════════════════════════════════════════════════════════
